kind: CronJob
apiVersion: batch/v1
metadata:
  name: backup-cronjob
  namespace: nginx
  labels:
    app: backup
spec:
  schedule: '*/5 * * * *'
  jobTemplate:
    spec:
      template:
        metadata:
          name: backup-job
          labels:
            app: backup
        spec:
          containers:
          - name: backup-container
            image: busybox
            command: ["sh", "-c", "echo backup started && mkdir -p /backups && mkdir /data && cp -r /demo-data /backup && echo backup completed"]
            volumeMounts:
            - name: data-volume
              mountPath: /demo-data
            - name: backup-volume
              mountPath: /backup
          restartPolicy: Never
          volumes:
            - name: data-volume
              hostPath:
                path: /demo-data
                type: DirectoryOrCreate
            - name: backup-volume
              hostPath:
                path: /backup
                type: DirectoryOrCreate