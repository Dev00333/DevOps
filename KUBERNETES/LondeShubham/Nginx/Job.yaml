kind: Job
apiVersion: batch/v1
metadata:
  name: batch-job
  namespace: nginx
  labels:
    app: batch
spec:
  completions: 1
  parallelism: 2
  backoffLimit: 4
  template:
    metadata:
      name: batch-job-pod
      labels:
        app: batch
    spec:
      containers:
      - name: batch-container
        image: busybox:latest
        command: ["sh", "-c", "echo this batch process completed && sleep 10"]
      restartPolicy: OnFailure